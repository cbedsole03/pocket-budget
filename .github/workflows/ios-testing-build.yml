name: iOS testing build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-testing-build
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      ver: ${{ steps.meta.outputs.ver }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-testing-latest"
          VER=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          DATE=$(date -u +%Y-%m-%d)
          SHA="${GITHUB_SHA:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "PocketBudget iOS testing build v${VER} · ${DATE} · ${SHA}" \
            --notes "Rolling SideStore-ready unsigned IPA. Download the asset, let SideStore re-sign it, and point the app at your backend URL in Settings."
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

  ios:
    needs: meta
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: |
          brew untap aws/tap || true
          brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build PocketBudget for device
        run: >-
          xcodebuild -scheme PocketBudget -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - name: Package unsigned IPA and attach
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.meta.outputs.ver }}
        run: |
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app not found"; exit 1; }
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr "PocketBudget-ios-unsigned-v${VER}.ipa" Payload
          gh release upload "${{ needs.meta.outputs.tag }}" "PocketBudget-ios-unsigned-v${VER}.ipa" --repo "$GITHUB_REPOSITORY" --clobber

